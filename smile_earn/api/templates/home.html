<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smile & Earn Dashboard</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card-bg: #fff;
      --primary: #007bff;
      --success: #28a745;
      --danger: #dc3545;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
    }
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      margin: 40px 0 10px;
      color: #222;
    }
    p {
      margin-bottom: 30px;
      color: #555;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 900px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      text-align: center;
      padding: 25px 15px;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    .status {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .online { color: var(--success); }
    .offline { color: var(--danger); }
    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>😄 Smile & Earn System</h1>
  <p>Select a service to manage or test</p>

  <div class="grid" id="serviceGrid"></div>

  <footer>© 2025 Smile & Earn · Prototype Dashboard</footer>

  <script>
    const services = [
      { name: "🛍️ Store", url: "http://127.0.0.1:5003/shopping", ping: "http://127.0.0.1:5003/shopping" },
      { name: "📸 Register Face", url: "http://127.0.0.1:5001/", ping: "http://127.0.0.1:5001/" },
      { name: "🧠 Train Model", url: "http://127.0.0.1:5002/train", ping: "http://127.0.0.1:5002/train" },
      { name: "👀 Peek Users", url: "http://127.0.0.1:5002/peek_faces", ping: "http://127.0.0.1:5002/peek_faces" },
    ];

    const grid = document.getElementById('serviceGrid');

    // Render the cards
    services.forEach(svc => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="icon">${svc.name.split(' ')[0]}</div>
        <h3>${svc.name.split(' ').slice(1).join(' ')}</h3>
        <div class="status">Checking...</div>
      `;
      card.addEventListener('click', () => window.open(svc.url, '_blank'));
      grid.appendChild(card);

      // Ping the service
      fetch(svc.ping, { method: 'GET' })
        .then(r => {
          const st = card.querySelector('.status');
          if (r.ok) {
            st.textContent = '🟢 Online';
            st.classList.add('online');
          } else {
            st.textContent = '🔴 Offline';
            st.classList.add('offline');
          }
        })
        .catch(() => {
          const st = card.querySelector('.status');
          st.textContent = '🔴 Offline';
          st.classList.add('offline');
        });
    });
  </script>
</body>
</html>

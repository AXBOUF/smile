<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Thank You!</title>
  <style>
    body { text-align: center; font-family: sans-serif; margin-top: 50px; }
    img { margin-top: 20px; width: 200px; }
  </style>
</head>
<body>
  <h2>Thank you for shopping, {{ person }}! 🛍️</h2>
  <p>Your face was recognized successfully.</p>
  {% if qr_data %}
  <p>Scan this QR to view your receipt:</p>
  <img src="data:image/png;base64,{{ qr_data }}">
  {% endif %}
  <p><a href="/shopping">⬅️ Back to Store</a></p>
</body>
</html>

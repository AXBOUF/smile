<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Face</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #fafafa; margin-top: 40px; }
    video, canvas { border: 2px solid #333; border-radius: 8px; margin: 10px; }
    input, button { margin: 10px; padding: 10px; font-size: 1em; }
    button { background: #007bff; border: none; color: #fff; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h2>📸 Register Your Face</h2>

  <input id="name" type="text" placeholder="Enter your name" /><br>
  <video id="video" width="480" height="360" autoplay playsinline></video><br>
  <button id="captureBtn">Capture & Upload</button>
  <p id="status"></p>

  <script>
    const video = document.getElementById('video');
    const nameInput = document.getElementById('name');
    const captureBtn = document.getElementById('captureBtn');
    const statusText = document.getElementById('status');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        statusText.innerText = "✅ Camera ready!";
      } catch (err) {
        statusText.innerText = "❌ Camera access denied: " + err.message;
        console.error(err);
      }
    }

    async function captureAndUpload() {
      const name = nameInput.value.trim();
      if (!name) {
        alert("Please enter your name first.");
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 480;
      canvas.height = video.videoHeight || 360;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      statusText.innerText = "📸 Capturing...";

      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('name', name);
        formData.append('image', blob, 'capture.jpg');

        try {
          const res = await fetch('/upload', { method: 'POST', body: formData });
          const data = await res.json();
          if (res.ok) {
            statusText.innerText = `✅ ${data.message} (Points: ${data.points || 0})`;
            console.log(data);
          } else {
            statusText.innerText = "❌ Upload failed: " + data.error;
            console.error(data);
          }
        } catch (err) {
          statusText.innerText = "❌ Network error: " + err.message;
          console.error(err);
        }
      }, 'image/jpeg');
    }

    captureBtn.addEventListener('click', captureAndUpload);
    startCamera();
  </script>
</body>
</html>
